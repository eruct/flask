<!DOCTYPE html>
<html>
<head>
    <title>Гостевая книга</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1>✏️ Гостевая книга</h1>

        <form method="POST">
            <input type="text" name="name" placeholder="Как вас зовут?" required>
            <textarea name="text" placeholder="Напишите ваш комментарий..." rows="4" required></textarea>
            <button type="submit">📨 Отправить</button>
        </form>

        <div class="comments">
            {% for comment in comments %}
                <div class="comment">
                    <h3>{{ comment.name }} <small>{{ comment.date }}</small></h3>
                    <p>{{ comment.text }}</p>
                </div>
            {% endfor %}
        </div>

        <div class="pagination">
            {% if page > 1 %}
                <a href="{{ url_for('index', page=page-1) }}">← Назад</a>
            {% endif %}

            <span>Страница {{ page }} из {{ total_pages }}</span>

            {% if page < total_pages %}
                <a href="{{ url_for('index', page=page+1) }}">Вперед →</a>
            {% endif %}
        </div>
    </div>
</body>
</html>
